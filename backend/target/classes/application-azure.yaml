# No DB password. The JDBC plugin obtains fresh Entra tokens for connections.
# Kubernetes Workload Identity provides AZURE_CLIENT_ID, AZURE_TENANT_ID,
# and AZURE_FEDERATED_TOKEN_FILE. Do not enable IMDS-only authentication here.
spring:
  datasource:
    hikari:
      data-source-properties:
        authenticationPluginClassName: com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin
        sslmode: verify-full
        sslrootcert: ${DB_SSL_ROOT_CERT:/etc/ssl/certs/ca-certificates.crt}
  flyway:
    enabled: false
