{{- if not .Values.bootstrapOnly }}
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: notekeeper-api}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: management, port: 9090, targetPort: management}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notekeeper-api
spec:
  replicas: {{ .Values.backendReplicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app.kubernetes.io/name: notekeeper-api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notekeeper-api
        azure.workload.identity/use: "true"
      annotations:
        notekeeper/release-sha: {{ required "releaseSha is required" .Values.releaseSha | quote }}
    spec:
      serviceAccountName: notekeeper-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: {{ .Values.backendImage | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "notekeeper.security" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9090}
          env:
            {{- include "notekeeper.db-env" . | nindent 12 }}
            - name: DB_USERNAME
              value: {{ required "runtimeRole is required" .Values.runtimeRole | quote }}
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              value: {{ .Values.applicationInsightsConnectionString | quote }}
            - name: APPLICATIONINSIGHTS_SAMPLING_PERCENTAGE
              value: {{ .Values.traceSamplingPercentage | quote }}
            - name: LAB_FAULT_MODE
              value: {{ .Values.labFaultMode | quote }}
            - name: APPLICATIONINSIGHTS_ROLE_NAME
              value: notekeeper-api-dev
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: vault, mountPath: /mnt/secrets-store, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: vault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: {secretProviderClass: notekeeper-vault}
{{- end }}
