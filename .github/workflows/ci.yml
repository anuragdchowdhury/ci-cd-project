name: Test, build and publish
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backend-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Test Spring Boot using Java 21
        run: docker run --rm -v "$PWD/backend:/workspace" -w /workspace maven:3.9.12-eclipse-temurin-21 mvn -B -ntp verify
  frontend-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Test and build React using Node 24
        run: docker run --rm -v "$PWD/frontend:/workspace" -w /workspace node:24-alpine sh -ec 'npm ci; npm test; npm run build'
  images:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Build the two images once and start the local stack
        env:
          VCS_REF: ${{ github.sha }}
        run: |
          cp .env.example .env
          docker compose up --build -d
      - name: Verify real PostgreSQL migrations and same-origin CRUD
        run: python3 scripts/smoke.py
      - name: Publish the exact tested images with full commit SHA tags
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::notice::Tests passed. Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, then rerun this workflow to publish.'
            exit 0
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          python3 scripts/publish.py
          echo 'published=true' >> "$GITHUB_OUTPUT"
      - name: Store immutable image references for later promotion
        if: steps.publish.outputs.published == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.sha }}
          path: release.json
          retention-days: 14
          if-no-files-found: error
      - name: Print diagnostic container logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop the disposable test stack
        if: always()
        run: docker compose down --volumes
