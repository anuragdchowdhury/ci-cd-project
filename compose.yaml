name: notekeeper
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notekeeper}
      POSTGRES_USER: ${POSTGRES_USER:-notekeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    image: notekeeper-backend:${VCS_REF:-local}
    build:
      context: ./backend
      args:
        VCS_REF: ${VCS_REF:-local}
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-notekeeper}
      DB_USERNAME: ${POSTGRES_USER:-notekeeper}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      APP_ENVIRONMENT: local
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  frontend:
    image: notekeeper-frontend:${VCS_REF:-local}
    build:
      context: ./frontend
      args:
        VCS_REF: ${VCS_REF:-local}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [backend]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  postgres-data:
